backend:
  name: git-gateway
  branch: main # or master, depending on your primary Git branch name

# Points directly to your existing images folder
media_folder: "assets/images"
public_folder: "assets/images"

# Allows uploading photos via the built-in media library button
collections:
  - name: "gallery"
    label: "Gallery Images"
    folder: "assets/images"
    create: true
    fields:
      - { label: "Image Title", name: "title", widget: "string" }
      - { label: "Image File", name: "image", widget: "image" }