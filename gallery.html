<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery - Circle of Friends Upliftment Centre</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="logo-container">
      <img src="/assets/images/logo.jpeg" alt="Circle of Friends Upliftment Centre Logo">
    </div>
    <h1 class="site-title">Circle of Friends Upliftment Centre</h1>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="services.html">Programme</a>
      <a href="gallery.html" class="active">Gallery</a>
      <a href="contact.html">Contact Us</a>
    </nav>
  </header>

  <section class="hero-banner">
    <h1>Photo Gallery</h1>
    <p>Click on any photo below to open full-screen view and navigate the slideshow.</p>
  </section>

  <main class="main-container">
    <section class="content-section">
      <h2>Programme Activities & Moments</h2>
      
      <div class="gallery-grid">
        <div class="gallery-item" onclick="openModal(0)">
          <img src="/assets/images/photo1.jpeg" alt="Gallery Photo 1" onerror="this.src='/assets/images/logo.jpeg'">
        </div>
        <div class="gallery-item" onclick="openModal(1)">
          <img src="/assets/images/photo2.jpeg" alt="Gallery Photo 2" onerror="this.src='/assets/images/logo.jpeg'">
        </div>
      </div>
    </section>
  </main>

  <!-- Lightbox Modal -->
  <div id="imageModal" class="modal">
    <div class="modal-content">
      <span class="close-modal" onclick="closeModal()">&times;</span>
      <span class="modal-prev" onclick="changeImage(-1)">&#10094;</span>
      <img id="modalImg" src="" alt="Zoomed view" onerror="this.src='/assets/images/logo.jpeg'">
      <span class="modal-next" onclick="changeImage(1)">&#10095;</span>
    </div>
  </div>

  <footer class="site-footer">
    <p>&copy; 2026 Circle of Friends Upliftment Centre. All rights reserved.</p>
  </footer>

  <script>
    let currentIndex = 0;

    const galleryImages = [
      '/assets/images/photo1.jpeg',
      '/assets/images/photo2.jpeg'
    ];

    function openModal(index) {
      currentIndex = index;
      const modal = document.getElementById('imageModal');
      const modalImg = document.getElementById('modalImg');
      modalImg.src = galleryImages[currentIndex];
      modal.style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('imageModal').style.display = 'none';
    }

    function changeImage(direction) {
      currentIndex += direction;
      if (currentIndex < 0) currentIndex = galleryImages.length - 1;
      if (currentIndex >= galleryImages.length) currentIndex = 0;
      document.getElementById('modalImg').src = galleryImages[currentIndex];
    }

    // Close modal when clicking outside the image
    window.onclick = function(event) {
      const modal = document.getElementById('imageModal');
      if (event.target === modal) {
        closeModal();
      }
    };
  </script>

</body>
</html>
