<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Circle of Friends Upliftment Centre</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="assets/images/logo.jpeg" alt="Circle of Friends Logo">
        </div>
        <h1>Circle of Friends Upliftment Centre</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="services.html">Programme</a></li>
                <li><a href="gallery.html" class="active">Gallery</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h2>Photo Gallery</h2>
            <p>Click on any photo below to open full-screen view and navigate the slideshow.</p>
        </section>

        <section style="padding: 30px 20px; max-width: 950px; margin: 0 auto; text-align: center;">
            <h3>Programme Activities & Moments</h3>
            
            <div class="gallery-grid">
                <div class="gallery-item">
                    <img src="assets/images/photo1.jpeg" alt="Programme Activity 1">
                </div>
                <div class="gallery-item">
                    <img src="assets/images/photo2.jpeg" alt="Programme Activity 2">
                </div>
            </div>
        </section>

        <!-- Interactive Lightbox Modal -->
        <div id="lightbox-modal" class="lightbox">
            <span class="lightbox-close">&times;</span>
            <button class="lightbox-prev">&#10094;</button>
            <img class="lightbox-content" id="lightbox-img" alt="Enlarged Gallery Photo">
            <button class="lightbox-next">&#10095;</button>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Circle of Friends Upliftment Centre. All rights reserved.</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
