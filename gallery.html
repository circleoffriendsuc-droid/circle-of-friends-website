<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery - Circle of Friends Upliftment Centre</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="logo-container">
      <img src="/assets/images/logo.jpeg" alt="Circle of Friends Upliftment Centre Logo">
    </div>
    <h1 class="site-title">Circle of Friends Upliftment Centre</h1>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="services.html">Programme</a>
      <a href="gallery.html" class="active">Gallery</a>
      <a href="contact.html">Contact Us</a>
    </nav>
  </header>

  <section class="hero-banner">
    <h1>Photo Gallery</h1>
    <p>Click on any photo below to open full-screen view. Use arrow keys or swipe on mobile to navigate.</p>
  </section>

  <main class="main-container">
    <section class="content-section">
      <h2>Programme Activities & Moments</h2>
      
      <!-- Gallery Container -->
      <div class="gallery-grid" id="galleryGrid"></div>
    </section>
  </main>

  <!-- Lightbox Modal -->
  <div id="imageModal" class="modal">
    <div class="modal-content">
      <span class="close-modal" onclick="closeModal()">&times;</span>
      <span class="modal-prev" onclick="changeImage(-1)">&#10094;</span>
      <img id="modalImg" src="" alt="Zoomed view" onerror="this.src='/assets/images/logo.jpeg'">
      <span class="modal-next" onclick="changeImage(1)">&#10095;</span>
    </div>
  </div>

  <footer class="site-footer">
    <p>&copy; 2026 Circle of Friends Upliftment Centre. All rights reserved.</p>
  </footer>

  <script>
    let currentIndex = 0;
    let galleryImages = [];

    async function loadGallery() {
      const gridContainer = document.getElementById('galleryGrid');
      gridContainer.innerHTML = '';
      galleryImages = [];

      const repoPath = 'circleoffriendsuc-droid/circle-of-friends-website';

      try {
        // 1. Scan for files in both /gallery and /assets/images
        const [galleryFolder, assetsFolder] = await Promise.all([
          fetch(`https://api.github.com/repos/${repoPath}/contents/gallery`).then(res => res.ok ? res.json() : []),
          fetch(`https://api.github.com/repos/${repoPath}/contents/assets/images`).then(res => res.ok ? res.json() : [])
        ]);

        const allFiles = [...galleryFolder, ...assetsFolder];
        
        // Filter out markdown (.md) or json (.json) content files created by Decap CMS
        const contentFiles = allFiles.filter(f => f.name.endsWith('.json') || f.name.endsWith('.md'));

        for (const file of contentFiles) {
          const res = await fetch(file.download_url);
          const rawText = await res.text();
          
          let imagePath = null;
          let altText = 'Gallery Image';

          // Try parsing JSON format
          if (file.name.endsWith('.json')) {
            try {
              const data = JSON.parse(rawText);
              imagePath = data.image;
              altText = data.alt || data.title || altText;
            } catch (e) {}
          } 
          // Try parsing Frontmatter Markdown format (e.g. image: "/assets/images/...")
          else if (file.name.endsWith('.md')) {
            const match = rawText.match(/image:\s*["']?([^"'\r\n]+)["']?/);
            if (match) imagePath = match[1];
          }

          if (imagePath) {
            // Normalize path for web browser
            if (!imagePath.startsWith('/')) imagePath = '/' + imagePath;
            
            galleryImages.push(imagePath);
            const imgIndex = galleryImages.length - 1;

            const itemDiv = document.createElement('div');
            itemDiv.className = 'gallery-item';
            itemDiv.setAttribute('onclick', `openModal(${imgIndex})`);
            itemDiv.innerHTML = `<img src="${imagePath}" alt="${altText}" onerror="this.src='/assets/images/logo.jpeg'">`;
            gridContainer.appendChild(itemDiv);
          }
        }
      } catch (error) {
        console.warn('Error loading dynamic CMS files, rendering fallback:', error);
      }

      // Fallback images if no CMS items were parsed
      if (galleryImages.length === 0) {
        galleryImages = ['/assets/images/photo1.jpeg', '/assets/images/logo.jpeg'];
        gridContainer.innerHTML = `
          <div class="gallery-item" onclick="openModal(0)"><img src="/assets/images/photo1.jpeg" alt="Photo 1"></div>
          <div class="gallery-item" onclick="openModal(1)"><img src="/assets/images/logo.jpeg" alt="Logo"></div>
        `;
      }
    }

    document.addEventListener('DOMContentLoaded', loadGallery);

    function openModal(index) {
      if (galleryImages.length === 0) return;
      currentIndex = index;
      const modal = document.getElementById('imageModal');
      const modalImg = document.getElementById('modalImg');
      modalImg.src = galleryImages[currentIndex];
      modal.style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('imageModal').style.display = 'none';
    }

    function changeImage(direction) {
      if (galleryImages.length === 0) return;
      currentIndex += direction;
      if (currentIndex < 0) currentIndex = galleryImages.length - 1;
      if (currentIndex >= galleryImages.length) currentIndex = 0;
      document.getElementById('modalImg').src = galleryImages[currentIndex];
    }

    window.onclick = function(event) {
      const modal = document.getElementById('imageModal');
      if (event.target === modal) closeModal();
    };

    document.addEventListener('keydown', function(event) {
      const modal = document.getElementById('imageModal');
      if (modal.style.display === 'flex') {
        if (event.key === 'ArrowLeft') changeImage(-1);
        else if (event.key === 'ArrowRight') changeImage(1);
        else if (event.key === 'Escape') closeModal();
      }
    });

    let touchStartX = 0;
    let touchEndX = 0;
    const modal = document.getElementById('imageModal');

    modal.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, false);
    modal.addEventListener('touchend', e => { touchEndX = e.changedTouches[0].screenX; handleSwipe(); }, false);

    function handleSwipe() {
      const swipeDistance = touchEndX - touchStartX;
      if (swipeDistance < -40) changeImage(1);
      else if (swipeDistance > 40) changeImage(-1);
    }
  </script>

</body>
</html>
